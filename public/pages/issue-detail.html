<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Issue Detail – CrowdSolve</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="/" class="nav-logo"><span class="logo-dot"></span>Crowd<span>Solve</span></a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/trending" class="hide-mobile">Trending</a>
      <a href="/top-issues" class="hide-mobile">Top Issues</a>
      <div id="nav-auth" style="display:flex;gap:0.75rem;align-items:center"></div>
    </div>
  </div>
</nav>

<div class="section" style="max-width:860px">
  <a href="/" style="color:var(--text-muted);font-size:0.85rem;text-decoration:none;display:inline-flex;align-items:center;gap:0.4rem;margin-bottom:1.5rem">← Back to Issues</a>

  <div id="issue-content">
    <div class="spinner"></div>
  </div>
</div>

<!-- IMAGE LIGHTBOX -->
<div id="lightbox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:999;align-items:center;justify-content:center;cursor:pointer" onclick="this.style.display='none'">
  <img id="lightbox-img" style="max-width:90vw;max-height:90vh;border-radius:8px">
</div>

<script src="/js/app.js"></script>
<script>
  const issueId = window.location.pathname.split('/').pop();

  async function loadIssue() {
    try {
      const data = await API.get(`/issues/${issueId}`);
      renderIssue(data.issue);
    } catch(e) {
      document.getElementById('issue-content').innerHTML = `<div class="empty-state"><p>Issue not found.</p><a href="/" class="btn btn-primary mt-2">Go Home</a></div>`;
    }
  }

  function renderIssue(issue) {
    const user = API.getUser();
    const userId = user && (user.id || user._id);
    const upvoted = userId && issue.upvotes && issue.upvotes.some(v => v.toString() === userId.toString());
    const isGov = user && user.role === 'district_magistrate' || user.role === 'department_head';

    const imagesHtml = issue.images && issue.images.length > 0
      ? `<div style="display:flex;gap:0.75rem;flex-wrap:wrap;margin-bottom:1.5rem">
          ${issue.images.map(img => `<img src="${img}" onclick="openLightbox('${img}')" style="width:200px;height:140px;object-fit:cover;border-radius:10px;cursor:pointer;transition:transform 0.2s" onmouseover="this.style.transform='scale(1.03)'" onmouseout="this.style.transform='scale(1)'">`).join('')}
         </div>` : '';

    const proofHtml = issue.proof && issue.proof.images && issue.proof.images.length > 0
      ? `<div class="proof-section">
          <div class="proof-title">✅ Resolution Proof Submitted</div>
          <div class="proof-images">
            ${issue.proof.images.map(img => `<img src="${img}" class="proof-img" onclick="openLightbox('${img}')">`).join('')}
          </div>
          <p style="font-size:0.85rem;color:var(--text-dim)">${escHtml(issue.proof.description || '')}</p>
          <p style="font-size:0.78rem;color:var(--text-muted);margin-top:0.4rem">Verified on ${new Date(issue.proof.uploadedAt).toLocaleDateString()}</p>
        </div>` : '';

    const govActionsHtml = isGov ? `
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-top:1.5rem">
        <h3 style="font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;margin-bottom:1rem">🏛️ Government Controls</h3>
        <div class="form-row" style="margin-bottom:1rem">
          <div>
            <label class="form-label">Update Status</label>
            <select id="gov-status" class="form-select">
              <option value="pending" ${issue.status==='pending'?'selected':''}>⏳ Pending</option>
              <option value="in-progress" ${issue.status==='in-progress'?'selected':''}>🔄 In Progress</option>
              <option value="completed" ${issue.status==='completed'?'selected':''}>✅ Completed</option>
            </select>
          </div>
          <div>
            <label class="form-label">Government Note</label>
            <input type="text" id="gov-note" class="form-input" value="${escHtml(issue.governmentNote || '')}" placeholder="Add an official note...">
          </div>
        </div>
        <div style="display:flex;gap:0.75rem;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="updateStatus()">Update Status</button>
          <button class="btn btn-outline" onclick="document.getElementById('proof-section').style.display='block'">📸 Upload Proof</button>
        </div>
        <div id="proof-section" style="display:none;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border)">
          <label class="form-label">Proof Images</label>
          <input type="file" id="proof-files" multiple accept="image/*" class="form-input" style="margin-bottom:0.75rem">
          <textarea id="proof-desc" class="form-textarea" placeholder="Describe what was done to resolve this issue..." rows="3" style="margin-bottom:0.75rem"></textarea>
          <button class="btn btn-success" onclick="uploadProof()">Submit Resolution Proof</button>
        </div>
      </div>` : '';

    document.getElementById('issue-content').innerHTML = `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2rem" class="${priorityClass(issue.priority)}">
        <div style="display:flex;flex-wrap:wrap;gap:0.75rem;align-items:center;margin-bottom:1.25rem">
          <span class="category-badge">${categoryIcon(issue.category)} ${issue.category}</span>
          <span class="status-badge ${statusClass(issue.status)}">${statusLabel(issue.status)}</span>
          <span style="font-size:0.78rem;color:var(--text-muted);margin-left:auto">${timeAgo(issue.createdAt)} · by ${escHtml(issue.authorName || 'Anonymous')} · ${escHtml(issue.location?.city || '')}</span>
        </div>

        <h1 style="font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;margin-bottom:1rem;line-height:1.2">${escHtml(issue.title)}</h1>

        <p style="color:var(--text-dim);line-height:1.8;margin-bottom:1.5rem">${escHtml(issue.description)}</p>

        ${imagesHtml}

        <div style="display:flex;flex-wrap:wrap;gap:1.5rem;padding:1rem;background:var(--surface2);border-radius:10px;margin-bottom:1.5rem">
          <div><div style="font-size:0.75rem;color:var(--text-muted)">LOCATION</div><div style="font-size:0.9rem;margin-top:0.2rem">📍 ${escHtml(issue.location?.address || '')} ${issue.location?.pincode ? '- ' + issue.location.pincode : ''}</div></div>
          <div><div style="font-size:0.75rem;color:var(--text-muted)">PRIORITY</div><div style="font-size:0.9rem;margin-top:0.2rem;text-transform:capitalize">${issue.priority || 'medium'}</div></div>
          <div><div style="font-size:0.75rem;color:var(--text-muted)">UPVOTES</div><div style="font-size:0.9rem;font-weight:700;color:var(--accent);margin-top:0.2rem">▲ ${issue.upvoteCount || 0}</div></div>
          ${issue.resolvedAt ? `<div><div style="font-size:0.75rem;color:var(--text-muted)">RESOLVED</div><div style="font-size:0.9rem;color:var(--success);margin-top:0.2rem">✅ ${new Date(issue.resolvedAt).toLocaleDateString()}</div></div>` : ''}
        </div>

        ${issue.governmentNote ? `<div style="background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.2);border-radius:8px;padding:1rem;margin-bottom:1.25rem"><p style="font-size:0.78rem;color:var(--accent);font-weight:600;margin-bottom:0.3rem">🏛️ Official Government Note</p><p style="font-size:0.88rem;color:var(--text-dim)">${escHtml(issue.governmentNote)}</p></div>` : ''}

        ${proofHtml}

        ${issue.tags && issue.tags.length ? `<div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin:1.25rem 0">${issue.tags.map(t => `<span style="background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:0.2rem 0.75rem;font-size:0.78rem;color:var(--text-muted)">#${escHtml(t)}</span>`).join('')}</div>` : ''}

        <button id="upvote-btn" class="btn ${upvoted ? 'btn-primary' : 'btn-outline'}" onclick="handleDetailUpvote('${issue._id}')" style="margin-top:0.5rem">
          ▲ ${upvoted ? 'Upvoted' : 'Upvote'} (<span class="upvote-count">${issue.upvoteCount || 0}</span>)
        </button>

        ${govActionsHtml}
      </div>

      <!-- COMMENTS -->
      <div style="margin-top:1.5rem;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2rem">
        <h3 style="font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:700;margin-bottom:1.25rem">💬 Comments (${issue.comments?.length || 0})</h3>

        ${API.isLoggedIn() ? `
        <div style="display:flex;gap:0.75rem;margin-bottom:1.5rem">
          <textarea id="comment-text" class="form-textarea" placeholder="Share your thoughts or additional information..." rows="2" style="flex:1;resize:none"></textarea>
          <button class="btn btn-primary" onclick="postComment()" style="align-self:flex-end;white-space:nowrap">Post</button>
        </div>` : `<a href="/login" class="btn btn-outline" style="margin-bottom:1.5rem">Login to comment</a>`}

        <div id="comments-list">
          ${issue.comments && issue.comments.length > 0
            ? issue.comments.map(c => `
              <div style="padding:1rem 0;border-bottom:1px solid var(--border)">
                <div style="display:flex;justify-content:space-between;margin-bottom:0.4rem">
                  <span style="font-weight:600;font-size:0.87rem">${escHtml(c.userName || 'Anonymous')}</span>
                  <span style="font-size:0.78rem;color:var(--text-muted)">${timeAgo(c.createdAt)}</span>
                </div>
                <p style="font-size:0.9rem;color:var(--text-dim);line-height:1.6">${escHtml(c.text)}</p>
              </div>`).join('')
            : '<p style="color:var(--text-muted);font-size:0.88rem">No comments yet. Be the first to comment!</p>'
          }
        </div>
      </div>
    `;
  }

  async function handleDetailUpvote(id) {
    if (!API.isLoggedIn()) { showToast('Please login to upvote', 'error'); window.location.href = '/login'; return; }
    try {
      const data = await API.put(`/issues/${id}/upvote`);
      showToast(data.upvoted ? 'Upvoted!' : 'Upvote removed');
      loadIssue(); // reload to reflect new state
    } catch(e) { showToast(e.message, 'error'); }
  }

  async function updateStatus() {
    const status = document.getElementById('gov-status').value;
    const note = document.getElementById('gov-note').value;
    try {
      await API.put(`/issues/${issueId}/status`, { status, governmentNote: note });
      showToast('Status updated!');
      loadIssue();
    } catch(e) { showToast(e.message, 'error'); }
  }

  async function uploadProof() {
    const files = document.getElementById('proof-files').files;
    const desc = document.getElementById('proof-desc').value;
    if (!files.length) { showToast('Please select proof images', 'error'); return; }

    const fd = new FormData();
    [...files].forEach(f => fd.append('proofImages', f));
    fd.append('description', desc);

    try {
      await API.put(`/issues/${issueId}/proof`, fd, true);
      showToast('Proof uploaded! Issue marked as completed.');
      loadIssue();
    } catch(e) { showToast(e.message, 'error'); }
  }

  async function postComment() {
    const text = document.getElementById('comment-text').value.trim();
    if (!text) return;
    try {
      const data = await API.post(`/issues/${issueId}/comment`, { text });
      document.getElementById('comment-text').value = '';
      showToast('Comment posted!');
      loadIssue();
    } catch(e) { showToast(e.message, 'error'); }
  }

  function openLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').style.display = 'flex';
  }

  loadIssue();
</script>
</body>
</html>
