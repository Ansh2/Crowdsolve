<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – CrowdSolve</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="/" class="nav-logo"><span class="logo-dot"></span>Crowd<span>Solve</span></a>
    <div class="nav-links">
      <a href="/">Home</a>
      <div id="nav-auth" style="display:flex;gap:0.75rem;align-items:center"></div>
    </div>
  </div>
</nav>

<div class="form-container">
  <div class="form-card">
    <div class="form-title">Welcome back</div>
    <div class="form-subtitle">Sign in to your CrowdSolve account</div>

    <div id="alert" class="alert alert-error"></div>

    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" id="email" class="form-input" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" id="password" class="form-input" placeholder="••••••••">
    </div>

    <button class="btn btn-primary w-full" style="justify-content:center;padding:0.8rem" onclick="login()">Sign In</button>

    <p style="text-align:center;margin-top:1.5rem;font-size:0.87rem;color:var(--text-muted)">
      Don't have an account? <a href="/register" style="color:var(--accent)">Register here</a>
    </p>

    <div style="margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--border)">
      <p style="font-size:0.8rem;color:var(--text-muted);margin-bottom:0.5rem;font-weight:600">Quick Demo Logins:</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin-bottom:0.5rem">
        <button class="btn btn-outline" style="font-size:0.75rem" onclick="demoLogin('citizen','Ahmedabad')">👤 Citizen – Ahmedabad</button>
        <button class="btn btn-outline" style="font-size:0.75rem" onclick="demoLogin('citizen','Rajkot')">👤 Citizen – Rajkot</button>
        <button class="btn btn-outline" style="font-size:0.75rem" onclick="demoLogin('citizen','Surat')">👤 Citizen – Surat</button>
        <button class="btn btn-outline" style="font-size:0.75rem" onclick="demoLogin('citizen','Vadodara')">👤 Citizen – Vadodara</button>
        <button class="btn btn-outline" style="font-size:0.75rem" onclick="demoLogin('citizen','Anand')">👤 Citizen – Anand</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin-bottom:0.5rem">
        <button class="btn btn-outline" style="font-size:0.75rem;border-color:#3b82f6;color:#3b82f6" onclick="demoLogin('dm','Ahmedabad')">🏛️ DM – Ahmedabad</button>
        <button class="btn btn-outline" style="font-size:0.75rem;border-color:#3b82f6;color:#3b82f6" onclick="demoLogin('dm','Rajkot')">🏛️ DM – Rajkot</button>
        <button class="btn btn-outline" style="font-size:0.75rem;border-color:#3b82f6;color:#3b82f6" onclick="demoLogin('dm','Surat')">🏛️ DM – Surat</button>
        <button class="btn btn-outline" style="font-size:0.75rem;border-color:#3b82f6;color:#3b82f6" onclick="demoLogin('dm','Vadodara')">🏛️ DM – Vadodara</button>
        <button class="btn btn-outline" style="font-size:0.75rem;border-color:#3b82f6;color:#3b82f6" onclick="demoLogin('dm','Anand')">🏛️ DM – Anand</button>
      </div>
      <p style="font-size:0.75rem;color:var(--text-muted);margin-top:0.25rem">Dept Head: roads.ahmedabad@gujarat.gov.in / demo123</p>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  if (API.isLoggedIn()) window.location.href = '/';

  async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const alertEl = document.getElementById('alert');

    if (!email || !password) {
      alertEl.textContent = 'Please fill in all fields';
      alertEl.style.display = 'block'; return;
    }

    try {
      const data = await API.post('/auth/login', { email, password });
      API.setAuth(data.token, data.user);
      showToast('Welcome back, ' + data.user.name + '!');
      const role = data.user.role;
      setTimeout(() => {
        if (role === 'district_magistrate' || role === 'department_head') {
          window.location.href = '/dashboard';
        } else {
          window.location.href = '/';
        }
      }, 600);
    } catch(e) {
      alertEl.textContent = e.message;
      alertEl.style.display = 'block';
    }
  }

  function demoLogin(type, city) {
    const slug = city.toLowerCase();
    let email;
    if (type === 'citizen') email = `demo.${slug}@citizen.com`;
    else if (type === 'dm') email = `dm.${slug}@gujarat.gov.in`;
    document.getElementById('email').value = email;
    document.getElementById('password').value = 'demo123';
    login();
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
