<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trending Issues – CrowdSolve</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="/" class="nav-logo"><span class="logo-dot"></span>Crowd<span>Solve</span></a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/trending" class="active">Trending</a>
      <a href="/top-issues" class="hide-mobile">Top Issues</a>
      <div id="nav-auth" style="display:flex;gap:0.75rem;align-items:center"></div>
    </div>
  </div>
</nav>

<div class="section">
  <div style="text-align:center;padding:3rem 0 2rem">
    <div class="hero-eyebrow" style="display:inline-flex">🔥 Most Upvoted</div>
    <h1 style="font-family:'Syne',sans-serif;font-size:2.5rem;font-weight:800;margin-top:1rem">Trending City Issues</h1>
    <p style="color:var(--text-muted);margin-top:0.75rem">Issues getting the most attention from citizens right now</p>
  </div>

  <div style="display:flex;gap:1rem;flex-wrap:wrap;align-items:center;margin-bottom:1.5rem">
    <input type="text" id="city-filter" class="form-input" style="max-width:240px" placeholder="Filter by city..." oninput="debounceLoad(this.value)">
    <div class="filters" style="margin:0">
      <button class="filter-btn active" onclick="filterCat('', this)">All</button>
      <button class="filter-btn" onclick="filterCat('roads', this)">🛣️ Roads</button>
      <button class="filter-btn" onclick="filterCat('water', this)">💧 Water</button>
      <button class="filter-btn" onclick="filterCat('electricity', this)">⚡ Electricity</button>
      <button class="filter-btn" onclick="filterCat('sanitation', this)">🗑️ Sanitation</button>
    </div>
  </div>

  <div id="trending-grid" class="issues-grid">
    <div class="spinner"></div>
  </div>
  <div class="pagination" id="pagination"></div>
</div>

<script src="/js/app.js"></script>
<script>
  let cityFilter = '', catFilter = '', page = 1, timer;

  async function load() {
    const grid = document.getElementById('trending-grid');
    grid.innerHTML = '<div class="spinner"></div>';

    const params = new URLSearchParams({
      sort: 'trending', page, limit: 12,
      ...(cityFilter && { city: cityFilter }),
      ...(catFilter && { category: catFilter })
    });

    try {
      const data = await fetch(`/api/issues?${params}`).then(r => r.json());
      if (!data.issues || !data.issues.length) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🏖️</div><p>No trending issues yet in this area.</p></div>`;
        document.getElementById('pagination').innerHTML = '';
        return;
      }
      grid.innerHTML = data.issues.map(i => renderIssueCard(i)).join('');
      // Render pagination
      const pag = document.getElementById('pagination');
      if (data.pages > 1) {
        let html = '';
        for (let i = 1; i <= data.pages; i++) html += `<button class="page-btn ${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`;
        pag.innerHTML = html;
      } else pag.innerHTML = '';
    } catch(e) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><p>Failed to load.</p></div>`;
    }
  }

  function debounceLoad(val) {
    clearTimeout(timer);
    timer = setTimeout(() => { cityFilter = val; page = 1; load(); }, 400);
  }

  function filterCat(cat, btn) {
    catFilter = cat; page = 1;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    load();
  }

  function goPage(p) { page = p; load(); window.scrollTo({top:200, behavior:'smooth'}); }

  load();
</script>
</body>
</html>
